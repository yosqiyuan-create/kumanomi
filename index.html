<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="俺の水族館">
<meta name="theme-color" content="#041a2a">
<title>俺の水族館</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #021018; color: #eaf8ff;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,10,20,0.55) 100%); }

  /* ---------- splash ---------- */
  #splash { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 0%, #1c7a96 0%, #0a3d5a 40%, #03192a 100%);
    transition: opacity 1.1s ease, visibility 1.1s; }
  #splash.hide { opacity: 0; visibility: hidden; }
  #splash .rays { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #splash .rays i { position: absolute; top: -10%; width: 14%; height: 120%; transform-origin: top center;
    background: linear-gradient(to bottom, rgba(190,240,255,0.22), rgba(190,240,255,0)); filter: blur(6px);
    animation: sway 7s ease-in-out infinite alternate; }
  #splash .rays i:nth-child(1) { left: 12%; transform: rotate(12deg); }
  #splash .rays i:nth-child(2) { left: 42%; transform: rotate(6deg); animation-delay: -2s; width: 9%; }
  #splash .rays i:nth-child(3) { left: 70%; transform: rotate(-4deg); animation-delay: -4s; }
  @keyframes sway { from { opacity: .5; } to { opacity: 1; } }
  #splash .bubble { position: absolute; bottom: -20px; border-radius: 50%; border: 1.5px solid rgba(220,250,255,.5);
    animation: rise linear infinite; }
  @keyframes rise { to { transform: translateY(-110vh); } }
  .logo { position: relative; text-align: center; padding: 0 24px; }
  .logo .fish { width: 132px; height: 132px; margin: 0 auto 22px; display: block; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .logo h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: .08em; text-shadow: 0 2px 12px rgba(0,30,50,.6); }
  .logo .by { margin-top: 14px; font-size: 15px; letter-spacing: .12em; opacity: .85; font-style: italic; }
  .logo .ver { margin-top: 6px; font-size: 12px; letter-spacing: .1em; opacity: .6; }
  #splash-status { position: absolute; bottom: calc(48px + var(--safe-bottom)); font-size: 13px; opacity: .75; letter-spacing: .05em; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1s ease .3s; }
  #hud.show { opacity: 1; }
  .top { position: absolute; top: calc(10px + var(--safe-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; }
  .card { pointer-events: auto; background: rgba(4, 30, 46, .45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(160, 225, 255, .18); border-radius: 14px; padding: 8px 12px; }
  .name { font-size: 14px; font-weight: 600; }
  .meter { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 12px; opacity: .92; }
  .track { width: 96px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  .bar { height: 100%; width: 50%; border-radius: 4px; transition: width .4s; }
  #hunger-bar { background: linear-gradient(90deg, #ff9a3c, #ffd36b); }
  #health-bar { background: linear-gradient(90deg, #ff6aa0, #ffb0d0); }
  #water-bar { background: linear-gradient(90deg, #3ab0ff, #8fe6ff); }
  .bar.low { background: #ff4a4a !important; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  .meter .lbl { width: 3em; }
  .name .edit { font-size: 11px; opacity: .6; }
  .days { font-size: 11px; opacity: .75; margin-top: 2px; }
  .msg { display: none; margin-top: 7px; font-size: 12px; color: #ffd36b; max-width: 170px; line-height: 1.4; }
  .btn { pointer-events: auto; appearance: none; border: 1px solid rgba(160,225,255,.25); color: #eaf8ff; font: inherit;
    background: rgba(4, 30, 46, .5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 12px; padding: 8px 12px; font-size: 13px; }
  .btn:active { transform: scale(.96); }
  .right { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .bottom { position: absolute; left: 0; right: 0; bottom: calc(18px + var(--safe-bottom)); display: flex; justify-content: center; gap: 12px; }
  #btn-water { font-size: 16px; font-weight: 700; padding: 13px 22px; border-radius: 30px; background: linear-gradient(180deg, rgba(60,170,255,.9), rgba(20,110,210,.9)); border-color: rgba(190,230,255,.5); box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  #btn-feed { font-size: 16px; font-weight: 700; padding: 13px 26px; border-radius: 30px;
    background: linear-gradient(180deg, rgba(255,150,60,.9), rgba(230,100,20,.9)); border-color: rgba(255,220,180,.5);
    box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  #hint { position: fixed; left: 50%; bottom: calc(90px + var(--safe-bottom)); transform: translateX(-50%);
    font-size: 13px; background: rgba(4,30,46,.55); padding: 8px 16px; border-radius: 16px; text-align: center; line-height: 1.6; white-space: nowrap;
    opacity: 0; transition: opacity .8s; pointer-events: none; }
  #hint.show { opacity: 1; }
  #toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.9); font-size: 15px; font-weight: 600;
    background: rgba(255,140,40,.85); padding: 8px 18px; border-radius: 20px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; }
  #death { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center;
    background: rgba(2, 12, 22, .55); opacity: 0; visibility: hidden; transition: opacity 1.2s, visibility 1.2s; }
  #death.show { opacity: 1; visibility: visible; }
  #death .panel { width: min(320px, 86vw); text-align: center; padding: 24px 20px; border-radius: 20px;
    background: rgba(8, 36, 56, .85); border: 1px solid rgba(170,220,255,.25); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #death .flower { font-size: 34px; }
  #death .t { font-size: 18px; font-weight: 700; margin: 10px 0 12px; line-height: 1.5; }
  #death .d { font-size: 14px; opacity: .9; margin: 4px 0; line-height: 1.5; }
  #death .d.small { font-size: 12px; opacity: .7; margin-top: 10px; }
  #btn-newfish { margin-top: 16px; font-size: 15px; font-weight: 700; padding: 12px 22px; border-radius: 26px;
    background: linear-gradient(180deg, rgba(255,150,60,.95), rgba(230,100,20,.95)); }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #hint.hide { opacity: 0; }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>

<div id="hud">
  <div class="top">
    <div class="card">
      <div class="name" style="pointer-events:auto"><span id="fish-name">クマノミ</span> <span class="edit">✎</span></div>
      <div class="days" id="day-count">飼って1日目</div>
      <div class="meter"><span class="lbl">おなか</span><div class="track"><div id="hunger-bar" class="bar"></div></div></div>
      <div class="meter"><span class="lbl">元気</span><div class="track"><div id="health-bar" class="bar"></div></div></div>
      <div class="meter"><span class="lbl">水</span><div class="track"><div id="water-bar" class="bar"></div></div></div>
      <div class="msg" id="care-msg"></div>
    </div>
    <div class="right">
      <button class="btn" id="btn-quality">画質：標準</button>
      <button class="btn" id="btn-camera">近くで見る</button>
    </div>
  </div>
  <div class="bottom"><button class="btn" id="btn-feed">エサをあげる</button><button class="btn" id="btn-water">水換え</button></div>
</div>
<div id="death">
  <div class="panel">
    <div class="flower">🌸</div>
    <div class="t" id="death-title"></div>
    <div class="d" id="death-days"></div>
    <div class="d" id="death-cause"></div>
    <div class="d small">おなかと水をこまめにお世話すると、長生きします。</div>
    <button class="btn" id="btn-newfish">新しいクマノミを迎える</button>
  </div>
</div>
<div id="toast">エサをあげました</div>
<div id="hint">水の中をタップしてもエサが落ちます<br>指でなぞると見回せます</div>

<div id="splash">
  <div class="rays"><i></i><i></i><i></i></div>
  <div class="logo">
    <img class="fish" src="icon-512.png" alt="">
    <h1>俺の水族館</h1>
    <div class="by">by Urushihara</div>
    <div class="ver">Version 0.6.0</div>
  </div>
  <div id="splash-status">準備しています…</div>
</div>

<script>
  // splash bubbles
  (function () {
    var s = document.getElementById('splash');
    for (var i = 0; i < 14; i++) {
      var b = document.createElement('div'); b.className = 'bubble';
      var size = 6 + Math.random() * 16;
      b.style.width = b.style.height = size + 'px';
      b.style.left = (Math.random() * 100) + '%';
      b.style.animationDuration = (5 + Math.random() * 6) + 's';
      b.style.animationDelay = (-Math.random() * 8) + 's';
      s.appendChild(b);
    }
  })();
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
